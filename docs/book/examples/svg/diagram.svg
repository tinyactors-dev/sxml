<svg xmlns="http://www.w3.org/2000/svg" width="360" height="380" viewBox="0 0 360 380">
  <title>Vane services</title>
  <style>
    .node rect { fill: #eef3fb; stroke: #3b5b92; stroke-width: 1.5 }
    .store rect { fill: #f6efe3; stroke: #8a6a2f }
    .node text { font: 14px sans-serif; fill: #1b1b1b }
    .edge line { stroke: #555555; stroke-width: 1.5 }
    .edge text { font: 12px sans-serif; fill: #555555 }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>
  <g class="edge" id="edge-gateway-flags">
    <line x1="180" y1="60" x2="180" y2="120" marker-end="url(#arrow)"/>
    <text x="186" y="94">HTTP</text>
  </g>
  <g class="edge" id="edge-flags-registry">
    <line x1="180" y1="160" x2="90" y2="220" marker-end="url(#arrow)"/>
    <text x="141" y="194">HTTP</text>
  </g>
  <g class="edge" id="edge-flags-cache">
    <line x1="180" y1="160" x2="270" y2="220" marker-end="url(#arrow)"/>
    <text x="231" y="194">Redis</text>
  </g>
  <g class="edge" id="edge-registry-database">
    <line x1="90" y1="260" x2="180" y2="320" marker-end="url(#arrow)"/>
    <text x="141" y="294">SQL</text>
  </g>
  <g class="node service" id="node-gateway">
    <rect x="110" y="20" width="140" height="40" rx="6"/>
    <text x="180" y="45" text-anchor="middle">api-gateway</text>
  </g>
  <g class="node service" id="node-flags">
    <rect x="110" y="120" width="140" height="40" rx="6"/>
    <text x="180" y="145" text-anchor="middle">flag-service</text>
  </g>
  <g class="node service" id="node-registry">
    <rect x="20" y="220" width="140" height="40" rx="6"/>
    <text x="90" y="245" text-anchor="middle">flag-registry</text>
  </g>
  <g class="node store" id="node-cache">
    <rect x="200" y="220" width="140" height="40" rx="20"/>
    <text x="270" y="245" text-anchor="middle">flag-cache</text>
  </g>
  <g class="node store" id="node-database">
    <rect x="110" y="320" width="140" height="40" rx="20"/>
    <text x="180" y="345" text-anchor="middle">postgresql</text>
  </g>
</svg>
