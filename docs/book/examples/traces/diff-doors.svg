<svg xmlns="http://www.w3.org/2000/svg" width="180" height="380" viewBox="0 0 180 380">
  <title>GET /doors: before.json and after.json</title>
  <style>
    .node rect { fill: #eef3fb; stroke: #3b5b92; stroke-width: 1.5 }
    .store rect { fill: #f6efe3; stroke: #8a6a2f }
    .node text { font: 14px sans-serif; fill: #1b1b1b }
    .edge line { stroke: #555555; stroke-width: 1.5 }
    .edge text { font: 12px sans-serif; fill: #555555 }
    .changed rect, .changed line, .changed path { stroke: #b26a00; stroke-width: 3 }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>
  <g class="edge" id="edge-api-gateway-lock-service">
    <line x1="90" y1="60" x2="90" y2="120" marker-end="url(#arrow)"/>
    <text x="96" y="94">1</text>
  </g>
  <g class="edge changed" id="edge-lock-service-lock-registry">
    <line x1="90" y1="160" x2="90" y2="220" marker-end="url(#arrow)"/>
    <text x="96" y="194">1 → 5</text>
  </g>
  <g class="edge changed" id="edge-lock-registry-postgresql">
    <line x1="90" y1="260" x2="90" y2="320" marker-end="url(#arrow)"/>
    <text x="96" y="294">1 → 5</text>
  </g>
  <g class="node service" id="node-api-gateway">
    <rect x="20" y="20" width="140" height="40" rx="6"/>
    <text x="90" y="45" text-anchor="middle">api-gateway</text>
  </g>
  <g class="node service" id="node-lock-service">
    <rect x="20" y="120" width="140" height="40" rx="6"/>
    <text x="90" y="145" text-anchor="middle">lock-service</text>
  </g>
  <g class="node service" id="node-lock-registry">
    <rect x="20" y="220" width="140" height="40" rx="6"/>
    <text x="90" y="245" text-anchor="middle">lock-registry</text>
  </g>
  <g class="node store" id="node-postgresql">
    <rect x="20" y="320" width="140" height="40" rx="20"/>
    <text x="90" y="345" text-anchor="middle">postgresql</text>
  </g>
</svg>
