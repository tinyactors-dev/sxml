[book]
title = "The sxml Book"
description = "Learn XPath 4.0, XQuery 4.0, XSLT 4.0 and XSD 1.1 with sxml, the small XML toolchain in portable C."
authors = ["The sxml contributors"]
language = "en"
src = "src"

[build]
# The rendered book goes below the repository's ignored build/ directory.
build-dir = "../../build/book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/tinyactors-dev/sxml"
edit-url-template = "https://github.com/tinyactors-dev/sxml/edit/main/docs/book/{path}"
# The book is served at https://sxml.tinyactors.dev/book/, beside the
# website (website/, mise run site), whose look style/ follows.
site-url = "/book/"
default-theme = "light"
preferred-dark-theme = "coal"
additional-css = ["style/sxml.css"]
additional-js = ["style/sxml.js"]
