<svg xmlns="http://www.w3.org/2000/svg" width="360" height="280" viewBox="0 0 360 280">
  <title>feature_flag</title>
  <style>
    .node rect { fill: #eef3fb; stroke: #3b5b92; stroke-width: 1.5 }
    .store rect { fill: #f6efe3; stroke: #8a6a2f }
    .node text { font: 14px sans-serif; fill: #1b1b1b }
    .edge line { stroke: #555555; stroke-width: 1.5 }
    .edge text { font: 12px sans-serif; fill: #555555 }
    .edge path { fill: none; stroke: #555555; stroke-width: 1.5 }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>
  <g class="edge" id="edge-stable-checking">
    <line x1="90" y1="60" x2="180" y2="120" marker-end="url(#arrow)"/>
    <text x="141" y="94">rollout.request</text>
  </g>
  <g class="edge" id="edge-stable-stable">
    <path d="M 40 60 C 40 84, 70 84, 70 60" marker-end="url(#arrow)"/>
    <text x="76" y="80">status.request</text>
  </g>
  <g class="edge" id="edge-checking-rolling-out">
    <line x1="180" y1="160" x2="90" y2="220" marker-end="url(#arrow)"/>
    <text x="141" y="194">check.passed</text>
  </g>
  <g class="edge" id="edge-checking-stable">
    <line x1="210" y1="120" x2="120" y2="60" marker-end="url(#arrow)"/>
    <text x="171" y="94">check.failed</text>
  </g>
  <g class="edge" id="edge-checking-paused">
    <line x1="180" y1="160" x2="270" y2="220" marker-end="url(#arrow)"/>
    <text x="231" y="194">check.failed</text>
  </g>
  <g class="edge" id="edge-rolling-out-stable">
    <line x1="120" y1="220" x2="120" y2="60" marker-end="url(#arrow)"/>
    <text x="126" y="144">kill.request, step.done</text>
  </g>
  <g class="edge" id="edge-rolling-out-rolling-out">
    <path d="M 40 260 C 40 284, 70 284, 70 260" marker-end="url(#arrow)"/>
    <text x="76" y="280">flag.evaluated</text>
  </g>
  <g class="edge" id="edge-paused-stable">
    <line x1="300" y1="220" x2="120" y2="60" marker-end="url(#arrow)"/>
    <text x="216" y="144">pause.expired</text>
  </g>
  <g class="edge" id="edge-archived-stable">
    <line x1="200" y1="40" x2="160" y2="40" marker-end="url(#arrow)"/>
    <text x="186" y="44">kill.request</text>
  </g>
  <g class="node service" id="node-stable">
    <rect x="20" y="20" width="140" height="40" rx="6"/>
    <text x="90" y="45" text-anchor="middle">stable</text>
  </g>
  <g class="node service" id="node-checking">
    <rect x="110" y="120" width="140" height="40" rx="6"/>
    <text x="180" y="145" text-anchor="middle">checking</text>
  </g>
  <g class="node service" id="node-rolling-out">
    <rect x="20" y="220" width="140" height="40" rx="6"/>
    <text x="90" y="245" text-anchor="middle">rolling-out</text>
  </g>
  <g class="node service" id="node-paused">
    <rect x="200" y="220" width="140" height="40" rx="6"/>
    <text x="270" y="245" text-anchor="middle">paused</text>
  </g>
  <g class="node service" id="node-archived">
    <rect x="200" y="20" width="140" height="40" rx="6"/>
    <text x="270" y="45" text-anchor="middle">archived</text>
  </g>
</svg>
