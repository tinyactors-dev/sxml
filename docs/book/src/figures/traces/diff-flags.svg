<svg xmlns="http://www.w3.org/2000/svg" width="143" height="288" viewBox="0 0 143 288">
  <title>GET /api/getFlags: before.json and after.json</title>
  <style>
    .node rect { fill: #eef3fb; stroke: #3b5b92; stroke-width: 1.5 }
    .store rect { fill: #f6efe3; stroke: #8a6a2f }
    .node text { font: 14px sans-serif; fill: #1b1b1b }
    .edge path { fill: none; stroke: #555555; stroke-width: 1.5 }
    .edge text { font: 12px sans-serif; fill: #555555 }
    .changed rect, .changed path { stroke: #b26a00; stroke-width: 3 }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>
  <g class="edge" id="edge-storefront-vane">
    <path d="M 71 60 C 71 72, 71 72, 71 84 L 71 100 C 71 112, 71 112, 71 124" marker-end="url(#arrow)"/>
    <text x="76" y="96">1</text>
  </g>
  <g class="edge changed" id="edge-vane-postgresql">
    <path d="M 71 164 C 71 176, 71 176, 71 188 L 71 204 C 71 216, 71 216, 71 228" marker-end="url(#arrow)"/>
    <text x="76" y="200">1 → 5</text>
  </g>
  <g class="node service" id="node-storefront">
    <rect x="20" y="20" width="102" height="40" rx="6"/>
    <text x="71" y="45" text-anchor="middle">storefront</text>
  </g>
  <g class="node service" id="node-vane">
    <rect x="21" y="124" width="100" height="40" rx="6"/>
    <text x="71" y="149" text-anchor="middle">vane</text>
  </g>
  <g class="node store" id="node-postgresql">
    <rect x="20" y="228" width="102" height="40" rx="20"/>
    <text x="71" y="253" text-anchor="middle">postgresql</text>
  </g>
</svg>
