<svg xmlns="http://www.w3.org/2000/svg" width="461" height="288" viewBox="0 0 461 288">
  <title>POST /api/killFlag: before.json and after.json</title>
  <style>
    .node rect { fill: #eef3fb; stroke: #3b5b92; stroke-width: 1.5 }
    .store rect { fill: #f6efe3; stroke: #8a6a2f }
    .node text { font: 14px sans-serif; fill: #1b1b1b }
    .edge path { fill: none; stroke: #555555; stroke-width: 1.5 }
    .edge text { font: 12px sans-serif; fill: #555555 }
    .removed rect, .removed path { stroke: #c62828; stroke-dasharray: 6 4 }
    .added rect, .added path { stroke: #2e7d32; stroke-width: 3 }
    .changed rect, .changed path { stroke: #b26a00; stroke-width: 3 }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>
  <g class="edge" id="edge-vane-console-vane">
    <path d="M 211 60 C 211 72, 211 72, 211 84 L 211 100 C 211 112, 211 112, 211 124" marker-end="url(#arrow)"/>
    <text x="216" y="96">1</text>
  </g>
  <g class="edge removed" id="edge-vane-redis">
    <path d="M 186 164 C 186 176, 70 176, 70 188 L 70 204 C 70 216, 70 216, 70 228" marker-end="url(#arrow)"/>
    <text x="75" y="200">1 → 0</text>
  </g>
  <g class="edge changed" id="edge-vane-postgresql">
    <path d="M 211 164 C 211 176, 201 176, 201 188 L 201 204 C 201 216, 201 216, 201 228" marker-end="url(#arrow)"/>
    <text x="206" y="200">2 → 3</text>
  </g>
  <g class="edge added" id="edge-vane-hooks.example.com">
    <path d="M 236 164 C 236 176, 362 176, 362 188 L 362 204 C 362 216, 362 216, 362 228" marker-end="url(#arrow)"/>
    <text x="367" y="200">0 → 1</text>
  </g>
  <g class="node service" id="node-vane-console">
    <rect x="152" y="20" width="118" height="40" rx="6"/>
    <text x="211" y="45" text-anchor="middle">vane-console</text>
  </g>
  <g class="node service" id="node-vane">
    <rect x="161" y="124" width="100" height="40" rx="6"/>
    <text x="211" y="149" text-anchor="middle">vane</text>
  </g>
  <g class="node store removed" id="node-redis">
    <rect x="20" y="228" width="100" height="40" rx="20"/>
    <text x="70" y="253" text-anchor="middle">redis</text>
  </g>
  <g class="node store" id="node-postgresql">
    <rect x="150" y="228" width="102" height="40" rx="20"/>
    <text x="201" y="253" text-anchor="middle">postgresql</text>
  </g>
  <g class="node service added" id="node-hooks.example.com">
    <rect x="283" y="228" width="158" height="40" rx="6"/>
    <text x="362" y="253" text-anchor="middle">hooks.example.com</text>
  </g>
