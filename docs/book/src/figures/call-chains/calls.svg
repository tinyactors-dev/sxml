<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480">
  <title>Call graph, before and after</title>
  <style>
    .node rect { fill: #eef3fb; stroke: #3b5b92; stroke-width: 1.5 }
    .store rect { fill: #f6efe3; stroke: #8a6a2f }
    .node text { font: 14px sans-serif; fill: #1b1b1b }
    .edge line { stroke: #555555; stroke-width: 1.5 }
    .edge text { font: 12px sans-serif; fill: #555555 }
    .added rect, .added line, .added path { stroke: #2e7d32; stroke-width: 3 }
    .removed rect, .removed line, .removed path { stroke: #c62828; stroke-dasharray: 6 4 }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>
  <g class="edge" id="edge-api.route-flags.killFlag">
    <line x1="720" y1="160" x2="630" y2="220" marker-end="url(#arrow)"/>
  </g>
  <g class="edge" id="edge-api.route-flags.listFlags">
    <line x1="720" y1="160" x2="810" y2="220" marker-end="url(#arrow)"/>
  </g>
  <g class="edge" id="edge-api.start-api.route">
    <line x1="720" y1="60" x2="720" y2="120" marker-end="url(#arrow)"/>
  </g>
  <g class="edge added" id="edge-audit.record-db.query">
    <line x1="90" y1="360" x2="720" y2="420" marker-end="url(#arrow)"/>
  </g>
  <g class="edge added" id="edge-flags.killFlag-audit.record">
    <line x1="630" y1="260" x2="90" y2="320" marker-end="url(#arrow)"/>
  </g>
  <g class="edge removed" id="edge-flags.killFlag-cache.getFlag">
    <line x1="630" y1="260" x2="270" y2="320" marker-end="url(#arrow)"/>
  </g>
  <g class="edge" id="edge-flags.killFlag-flags.isOwner">
    <line x1="630" y1="260" x2="450" y2="320" marker-end="url(#arrow)"/>
  </g>
  <g class="edge" id="edge-flags.killFlag-registry.getFlag">
    <line x1="630" y1="260" x2="630" y2="320" marker-end="url(#arrow)"/>
  </g>
  <g class="edge" id="edge-flags.killFlag-registry.setPercentage">
    <line x1="630" y1="260" x2="810" y2="320" marker-end="url(#arrow)"/>
  </g>
  <g class="edge" id="edge-flags.listFlags-flags.summarize">
    <line x1="810" y1="260" x2="990" y2="320" marker-end="url(#arrow)"/>
  </g>
  <g class="edge added" id="edge-flags.listFlags-registry.getFlag">
    <line x1="810" y1="260" x2="630" y2="320" marker-end="url(#arrow)"/>
    <text x="726" y="294">loop</text>
  </g>
  <g class="edge added" id="edge-flags.listFlags-registry.getFlagKeys">
    <line x1="810" y1="260" x2="1170" y2="320" marker-end="url(#arrow)"/>
  </g>
  <g class="edge removed" id="edge-flags.listFlags-registry.getFlags">
    <line x1="810" y1="260" x2="1350" y2="320" marker-end="url(#arrow)"/>
  </g>
  <g class="edge" id="edge-registry.getFlag-db.query">
    <line x1="630" y1="360" x2="720" y2="420" marker-end="url(#arrow)"/>
  </g>
  <g class="edge added" id="edge-registry.getFlagKeys-db.query">
    <line x1="1170" y1="360" x2="720" y2="420" marker-end="url(#arrow)"/>
  </g>
  <g class="edge removed" id="edge-registry.getFlags-db.query">
    <line x1="1350" y1="360" x2="720" y2="420" marker-end="url(#arrow)"/>
  </g>
  <g class="edge" id="edge-registry.setPercentage-db.query">
    <line x1="810" y1="360" x2="720" y2="420" marker-end="url(#arrow)"/>
  </g>
  <g class="node service" id="node-api.start">
    <rect x="650" y="20" width="140" height="40" rx="6"/>
    <text x="720" y="45" text-anchor="middle">api.start</text>
  </g>
  <g class="node service" id="node-api.route">
    <rect x="650" y="120" width="140" height="40" rx="6"/>
    <text x="720" y="145" text-anchor="middle">api.route</text>
  </g>
  <g class="node service" id="node-flags.killFlag">
    <rect x="560" y="220" width="140" height="40" rx="6"/>
    <text x="630" y="245" text-anchor="middle">flags.killFlag</text>
  </g>
  <g class="node service added" id="node-audit.record">
    <rect x="20" y="320" width="140" height="40" rx="6"/>
    <text x="90" y="345" text-anchor="middle">audit.record</text>
  </g>
  <g class="node service" id="node-db.query">
    <rect x="650" y="420" width="140" height="40" rx="6"/>
    <text x="720" y="445" text-anchor="middle">db.query</text>
  </g>
  <g class="node service removed" id="node-cache.getFlag">
    <rect x="200" y="320" width="140" height="40" rx="6"/>
    <text x="270" y="345" text-anchor="middle">cache.getFlag</text>
  </g>
  <g class="node service" id="node-flags.isOwner">
    <rect x="380" y="320" width="140" height="40" rx="6"/>
    <text x="450" y="345" text-anchor="middle">flags.isOwner</text>
  </g>
  <g class="node service" id="node-registry.getFlag">
    <rect x="560" y="320" width="140" height="40" rx="6"/>
    <text x="630" y="345" text-anchor="middle">registry.getFlag</text>
  </g>
  <g class="node service" id="node-registry.setPercentage">
    <rect x="740" y="320" width="140" height="40" rx="6"/>
    <text x="810" y="345" text-anchor="middle">registry.setPercentage</text>
  </g>
  <g class="node service" id="node-flags.listFlags">
    <rect x="740" y="220" width="140" height="40" rx="6"/>
    <text x="810" y="245" text-anchor="middle">flags.listFlags</text>
  </g>
  <g class="node service" id="node-flags.summarize">
    <rect x="920" y="320" width="140" height="40" rx="6"/>
    <text x="990" y="345" text-anchor="middle">flags.summarize</text>
  </g>
  <g class="node service added" id="node-registry.getFlagKeys">
    <rect x="1100" y="320" width="140" height="40" rx="6"/>
    <text x="1170" y="345" text-anchor="middle">registry.getFlagKeys</text>
  </g>
  <g class="node service removed" id="node-registry.getFlags">
    <rect x="1280" y="320" width="140" height="40" rx="6"/>
    <text x="1350" y="345" text-anchor="middle">registry.getFlags</text>
  </g>
</svg>
