    <text x="360" y="277" text-anchor="middle">vane/audit</text>
  </g>
  <g class="node store" id="node-redis">
    <rect x="24" y="356" width="100" height="40" rx="20"/>
    <text x="74" y="381" text-anchor="middle">redis</text>
  </g>
  <g class="node store" id="node-postgresql">
    <rect x="203" y="356" width="102" height="40" rx="20"/>
    <text x="254" y="381" text-anchor="middle">postgresql</text>
  </g>
  <g class="node service added" id="node-hooks">
    <rect x="336" y="356" width="158" height="40" rx="6"/>
