<svg xmlns="http://www.w3.org/2000/svg" width="514" height="416" viewBox="0 0 514 416">
  <title>Vane after the change</title>
  <style>
    .node rect { fill: #eef3fb; stroke: #3b5b92; stroke-width: 1.5 }
    .store rect { fill: #f6efe3; stroke: #8a6a2f }
    .node text { font: 14px sans-serif; fill: #1b1b1b }
    .edge path { fill: none; stroke: #555555; stroke-width: 1.5 }
    .edge text { font: 12px sans-serif; fill: #555555 }
    .changed rect, .changed path { stroke: #b26a00; stroke-width: 3 }
    .added rect, .added path { stroke: #2e7d32; stroke-width: 3 }
    .removed rect, .removed path { stroke: #c62828; stroke-dasharray: 6 4 }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>
  <g class="edge" id="edge-browser-api">
    <path d="M 144 60 C 144 72, 184 72, 184 84 L 184 100 C 184 112, 199 112, 199 124" marker-end="url(#arrow)"/>
    <text x="189" y="96">HTTP</text>
  </g>
  <g class="edge" id="edge-node-api">
    <path d="M 288 60 C 288 72, 248 72, 248 84 L 248 100 C 248 112, 232 112, 232 124" marker-end="url(#arrow)"/>
    <text x="253" y="96">HTTP</text>
  </g>
  <g class="edge" id="edge-api-flags">
    <path d="M 216 164 C 216 176, 216 176, 216 188" marker-end="url(#arrow)"/>
  </g>
  <g class="edge removed" id="edge-flags-cache">
    <path d="M 190 228 C 190 240, 71 240, 71 252" marker-end="url(#arrow)"/>
  </g>
  <g class="edge changed" id="edge-flags-registry">
    <path d="M 216 228 C 216 240, 216 240, 216 252" marker-end="url(#arrow)"/>
  </g>
  <g class="edge added" id="edge-flags-audit">
    <path d="M 241 228 C 241 240, 360 240, 360 252" marker-end="url(#arrow)"/>
  </g>
  <g class="edge" id="edge-cache-redis">
    <path d="M 71 292 C 71 304, 74 304, 74 316 L 74 332 C 74 344, 74 344, 74 356" marker-end="url(#arrow)"/>
    <text x="79" y="328">Redis</text>
  </g>
  <g class="edge" id="edge-registry-postgresql">
    <path d="M 216 292 C 216 304, 225 304, 225 316 L 225 332 C 225 344, 237 344, 237 356" marker-end="url(#arrow)"/>
    <text x="230" y="328">SQL</text>
  </g>
  <g class="edge added" id="edge-audit-postgresql">
    <path d="M 343 292 C 343 304, 283 304, 283 316 L 283 332 C 283 344, 271 344, 271 356" marker-end="url(#arrow)"/>
    <text x="288" y="328">SQL</text>
  </g>
  <g class="edge added" id="edge-audit-hooks">
    <path d="M 377 292 C 377 304, 415 304, 415 316 L 415 332 C 415 344, 415 344, 415 356" marker-end="url(#arrow)"/>
    <text x="420" y="328">HTTP</text>
  </g>
  <g class="node service" id="node-browser">
    <rect x="81" y="20" width="126" height="40" rx="6"/>
    <text x="144" y="45" text-anchor="middle">@vane/browser</text>
  </g>
  <g class="node service" id="node-node">
    <rect x="237" y="20" width="102" height="40" rx="6"/>
    <text x="288" y="45" text-anchor="middle">@vane/node</text>
  </g>
  <g class="node service" id="node-api">
    <rect x="166" y="124" width="100" height="40" rx="6"/>
    <text x="216" y="149" text-anchor="middle">vane/api</text>
  </g>
  <g class="node service changed" id="node-flags">
    <rect x="165" y="188" width="102" height="40" rx="6"/>
