# Continuous integration, kept short so that it spends few Actions minutes
# (D334; the owner, 2026-11-27): one Linux job, Clang, a release build of
# everything and its tests (ctest, about a minute on four cores). The
# CPU-heavy verification runs elsewhere, not here: the sanitizer presets,
# clang-tidy (tools/lint.sh), the conformance suites (docs/CONFORMANCE.md),
# fuzzing (tools/fuzz.sh), the WebAssembly module and the other platforms
# (docs/RELEASE.md, step 4).
#
# A newer push cancels the run in progress, on main too: only the newest
# commit's result matters, and a cancelled run costs nothing more.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "spec/articles/log/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Clang, release)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        # The Swift and Kotlin bindings are paused (D255): the runner has both
        # toolchains, so their tests are registered, and they are left out.
        run: ctest --preset release --parallel 4 --timeout 300 --exclude-regex "^(kotlin|swift)/"
