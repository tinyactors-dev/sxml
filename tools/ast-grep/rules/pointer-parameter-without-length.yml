id: pointer-parameter-without-length
language: c
severity: error
message: "Byte pointer parameter '$PARAMETER': pass bytes as an sxml_byte_view or sxml_memory_view so the length travels with them."
note: >
  docs/C_GUIDELINES.md, "Memory and buffers": a pointer to data never travels
  without its length. Flags parameters that are a single pointer to char,
  signed or unsigned char, uint8_t or int8_t, in include/, src/ and apps/. Pointers to
  objects (sxml_arena *), opaque state (void *) and pointers to pointers are
  not data and are allowed. An external boundary that must take a
  NUL-terminated string says so with
  `// ast-grep-ignore: pointer-parameter-without-length` on the line before.
files:
  - "**/include/**"
  - "**/src/**"
  - "**/apps/**"
rule:
  kind: parameter_declaration
  pattern: $PARAMETER
  all:
    - has:
        field: type
        regex: '^(char|signed char|unsigned char|uint8_t|int8_t)$'
    - has:
        field: declarator
        any:
          - kind: pointer_declarator
            not:
              has:
                field: declarator
                any:
                  - kind: pointer_declarator
                  - kind: abstract_pointer_declarator
          - kind: abstract_pointer_declarator
            not:
              has:
                any:
                  - kind: pointer_declarator
                  - kind: abstract_pointer_declarator
