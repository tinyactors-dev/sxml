id: input-output-outside-platform-layer
language: c
severity: error
message: "'$FUNCTION' touches the process environment: only apps/sxml/platform_stdio.c may call it; write through an sxml_cli_output_stream instead."
note: >
  docs/CLI.md, "Implementation map"; docs/DECISIONS.md, D44. The CLI
  framework and the sxml commands never print, open files, read the
  environment or exit; the platform layer does that behind interfaces, so
  tests can capture every byte the program writes.
files:
  - "**/apps/**"
ignores:
  - "**/apps/sxml/platform_stdio.c"
rule:
  kind: call_expression
  has:
    field: function
    pattern: $FUNCTION
    regex: '^(abort|exit|_Exit|quick_exit|atexit|system|getenv|printf|fprintf|vprintf|vfprintf|puts|fputs|putchar|putc|fputc|perror|fwrite|fread|fopen|freopen|fclose|fflush|fgets|fgetc|getc|getchar|scanf|fscanf|setvbuf|remove|rename|tmpfile|ferror|_setmode|_fileno)$'
